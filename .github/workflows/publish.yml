# イメージをビルドしてGHCRへ公開する。利用側はdigestとこのrepoのコミットSHAで版を固定する。
name: publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/wda-book-toolchain

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: toolchain:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm toolchain:ci cat /opt/toolchain/versions.txt
          docker run --rm -v "$PWD/test:/t" -w /tmp toolchain:ci \
            lualatex -interaction=nonstopmode -halt-on-error /t/font-warmup.tex

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### 版を固定するための値"
            echo '```'
            echo "IMAGE=${IMAGE}"
            echo "DIGEST=${{ steps.push.outputs.digest }}"
            echo "TOOLCHAIN_REPO=https://github.com/${{ github.repository }}.git"
            echo "TOOLCHAIN_SHA=${{ github.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
